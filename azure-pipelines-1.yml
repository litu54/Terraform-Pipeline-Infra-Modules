trigger: 
  branches:
   include: 
    - main 
    - feature/*


pool: Ado_Agent


stages: 
  - stage: Terraform-Lint
    displayName: Liniting
    jobs: Terraform-Lint
    steps: 
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          $ErrorActionPreference = "Stop"
          
          Write-Host "===== Terraform Lint Stage Started ====="
          
          # Step 1: Move to repository root
          Set-Location "$(Build.SourcesDirectory)"
          
          Write-Host "Repository path: $(Get-Location)"
          
          # Step 2: Verify TFLint installation
          if (-not (Get-Command tflint -ErrorAction SilentlyContinue)) {
              throw "TFLint is not installed or is missing from PATH on the Windows agent."
          }
          
          tflint --version
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to execute TFLint."
          }
          
          # Step 3: Locate Terraform files
          $tfFiles = Get-ChildItem `
              -Path "$(Build.SourcesDirectory)\Modules\Preprod" `
              -Filter "*.tf" `
              -Recurse `
              -File
          
          if (-not $tfFiles) {
              throw "No Terraform files found under Modules\Preprod."
          }
          
          Write-Host "Terraform files found: $($tfFiles.Count)"
          
          # Step 4: Initialize TFLint plugins
          tflint --init
          if ($LASTEXITCODE -ne 0) {
              throw "TFLint plugin initialization failed."
          }
          
          # Step 5: Run TFLint recursively
          tflint --recursive
          if ($LASTEXITCODE -ne 0) {
              throw "TFLint detected issues. Check the pipeline logs."
          }
          
          Write-Host "===== Terraform Lint Stage Passed ====="
     
    
  


