trigger:
  branches:
    include:
      - main
      - feature/*

pool: Ado_Agent

stages:
  - stage: TerraformLint
    displayName: Linting
    jobs:
      - job: LintingJob
        displayName: Linting Job
        steps:
          - task: PowerShell@2
            displayName: 'Install & Setup TFLint'
            inputs:
              targetType: 'inline'
              script: |
                Invoke-WebRequest -Uri "https://github.com/terraform-linters/tflint/releases/download/v0.50.0/tflint_windows_amd64.zip" -OutFile "tflint.zip"
                Expand-Archive -Path "tflint.zip" -DestinationPath "$env:USERPROFILE\tflint" -Force
                echo "##vso[task.prependpath]$env:USERPROFILE\tflint"
              workingDirectory: '$(Build.SourcesDirectory)\Modules\Preprod\Env\Dev'

          - task: PowerShell@2
            displayName: 'Run TFLint'
            inputs:
              targetType: 'inline'
              script: |
                $env:PATH += ";$env:USERPROFILE\tflint"
                tflint --init
                tflint --force
              workingDirectory: '$(Build.SourcesDirectory)\Modules\Preprod\Env\Dev'

  - stage: Trivy_scan
    displayName: Trivy-scan
    dependsOn: TerraformLint
    jobs:
      - job: TerraformScan
        steps:
          - task: trivy@2
            inputs:
              version: 'latest'
              type: 'repository'
              target: '$(Build.SourcesDirectory)\Modules\Preprod\Env\Dev'
              scanners: 'misconfig'
              severities: 'MEDIUM, HIGH'

  - stage: TerraformIint
    dependsOn: Trivy_scan
    # condition: succeeded()
    jobs:
      - job: TerraformInit
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)\Modules\Preprod\Env\Dev'
              backendServiceArm: 'ModulePipeline'
              backendAzureRmStorageAccountName: 'statemod1234'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'dev1.tfstate'

  - stage: terraform_validate
    dependsOn: TerraformIint
    condition: succeeded()
    jobs:
      - job: TerraformValidate
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)\Modules\Preprod\Env\Dev'
              backendServiceArm: 'ModulePipeline'
              backendAzureRmStorageAccountName: 'statemod1234'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'dev1.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)\Modules\Preprod\Env\Dev'

  - stage: terraform_plan
    dependsOn: terraform_validate
    condition: succeeded()
    jobs:
      - job: TerraformPlan
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)\Modules\Preprod\Env\Dev'
              backendServiceArm: 'ModulePipeline'
              backendAzureRmStorageAccountName: 'statemod1234'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'dev1.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)\Modules\Preprod\Env\Dev'

  - stage: manual_approval
    displayName: Approval-stage
    dependsOn: terraform_plan
    condition: succeeded()
    jobs:
      - job: ManualApprove
        pool: server
        steps:
          - task: ManualValidation@1
            inputs:
              notifyUsers: 'rout@gmail.com'
              allowApproversToApproveTheirOwnRuns: false
              instructions: 'Plz review the code'

  - stage: Apply
    displayName: Apply-for-dev
    dependsOn: manual_approval
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Apply
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)\Modules\Preprod\Env\Dev'
              backendServiceArm: 'ModulePipeline'
              backendAzureRmStorageAccountName: 'statemod1234'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'dev1.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)\Modules\Preprod\Env\Dev'
              environmentServiceNameAzureRM: 'ModulePipeline'

